inject_fault:
  name: Inject fault
  description: Force a specific turbine into a fault state.
  fields:
    turbine_id:
      name: Turbine ID
      description: The turbine to fault.
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box

reset_turbine:
  name: Reset turbine
  description: Reset a turbine back to normal, healthy operation.
  fields:
    turbine_id:
      name: Turbine ID
      description: The turbine to reset.
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box

set_wind_speed:
  name: Set wind speed
  description: Override the simulated global wind speed.
  fields:
    wind_speed:
      name: Wind speed
      description: Wind speed in m/s (0-25).
      required: true
      selector:
        number:
          min: 0
          max: 25
          step: 0.1
          mode: box
          unit_of_measurement: m/s
