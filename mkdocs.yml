site_name: Derril Water Solar Park
site_description: Home Assistant integration for Derril Water Solar Park
site_url: https://MJP-76.github.io/DerrilWaterSolarPark/
repo_url: https://github.com/MJP-76/DerrilWaterSolarPark
repo_name: MJP-76/DerrilWaterSolarPark
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Sensors: sensors.md
